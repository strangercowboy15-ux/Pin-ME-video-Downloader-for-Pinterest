openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: pinME Downloader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: download
    description: Pinterest video download operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /get-pin:
    post:
      operationId: getPin
      tags: [download]
      summary: Resolve Pinterest pin video URL
      description: Accepts a Pinterest URL and returns the direct video download URL and metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinInput"
      responses:
        "200":
          description: Video info resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinInfo"
        "400":
          description: Bad request (invalid URL, not a Pinterest link, no video)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pin not found or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error during extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PinInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: Pinterest pin URL (pinterest.com or pin.it short link)
    PinInfo:
      type: object
      required:
        - downloadUrl
        - filename
      properties:
        downloadUrl:
          type: string
          description: Server-proxied download path for the video
        filename:
          type: string
          description: Suggested filename for the download
        title:
          type: ["string", "null"]
          description: Title of the pin if available
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
